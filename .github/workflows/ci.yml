name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  RUN_MYSQL_TEST: "1"
  RUN_REDIS_TEST: "1"
  RUN_RABBITMQ_TEST: "1"
  MYSQL_TEST_PASSWORD: ci-password
  # Must stay [a-zA-Z0-9_]+ — internal/service/test_helper_test.go enforces
  # safeDatabaseName and t.Fatalf's otherwise. Hyphens are rejected there on
  # purpose (it is a SQL identifier interposed into CREATE DATABASE).
  MYSQL_TEST_DATABASE: go_order_management_system_test
  REDIS_ADDR: 127.0.0.1:6379
  RABBITMQ_URL: amqp://order_app:ci-rabbit-password@127.0.0.1:5672/

jobs:
  quality:
    name: Test, Vet, Validate, Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: go_order_inventory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: order_app
          RABBITMQ_DEFAULT_PASS: ci-rabbit-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.1

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run ./...

      # -v is required: without it `go test` prints no --- PASS / --- SKIP lines,
      # so a silently re-skipped integration suite would still read as `ok`.
      # pipefail is required so `tee` cannot mask a genuine test failure.
      - name: Run test
        shell: bash
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee /tmp/test.log

      # GAP-016 DoD-2: with RUN_MYSQL_TEST=1 set job-wide, no integration test may
      # be skipped. Any --- SKIP fails the build and the counts are printed as
      # the positive evidence that the suite really executed.
      # The pattern tolerates leading whitespace on purpose: skips inside t.Run
      # subtests print as `    --- SKIP: ...`, which a bare `^--- SKIP` misses.
      - name: Assert no integration test was skipped
        shell: bash
        run: |
          passes=$(grep -cE '^[[:space:]]*--- PASS' /tmp/test.log || true)
          skips=$(grep -cE '^[[:space:]]*--- SKIP' /tmp/test.log || true)
          echo "passes=$passes skips=$skips"
          if [ "$skips" -ne 0 ]; then
            echo "::error::tests were skipped ($skips) while integration switches are on; select tests with -run instead of skipping"
            grep -nE '^[[:space:]]*--- SKIP' /tmp/test.log | head -20
            exit 1
          fi
          if [ "$passes" -eq 0 ]; then
            echo "::error::no test reported --- PASS; the suite did not run"
            exit 1
          fi

      - name: Run race tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Validate migrations
        run: goose -dir migrations validate

      - name: Build binary
        run: go build -o bin/go-order-management-system ./cmd

      - name: Build Docker image
        run: docker build -t go-order-management-system:ci .

  # Frontend gate. Kept as a separate job on purpose: it shares no steps with the
  # Go loop, and folding it into `quality` would make every Go iteration wait on
  # npm install + Playwright. No services are needed.
  frontend:
    name: Frontend (tsc, eslint, vitest browser, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fronted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22 from engines in fronted/package-lock.json:
      #   vite 8.0.16   -> ^20.19.0 || >=22.12.0
      #   eslint 10.4.1 -> ^20.19.0 || ^22.13.0 || >=24
      #   vitest 4.1.8  -> ^20.0.0 || ^22.0.0 || >=24.0.0
      # 22 is the only major satisfying all three.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fronted/package-lock.json

      - name: Install dependencies
        run: npm ci

      # vitest runs in browser mode (vite.config.ts test.browser.provider=playwright),
      # so the Chromium binary must exist before the test step.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `tsc -b` (not `tsc --noEmit`): fronted/tsconfig.json is solution-style
      # ("files": [] + references), so a bare `tsc --noEmit` checks 0 files and
      # always exits 0. Measured with an injected TS2322 probe:
      #   npx tsc --noEmit                -> exit 0 (no diagnostics)
      #   npx tsc -b                      -> exit 2 (TS2322 reported)
      # Kept as its own step (npm run build already runs tsc -b) so a failure
      # is attributed to "type error", not "build failure".
      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Unit and browser tests
        run: npx vitest run --browser.headless

      - name: Build
        run: npm run build
