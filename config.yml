server:
  port: 8082

mysql:
  user: root
  host: 127.0.0.1
  port: "3306"
  database: go_order_management_system

  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifeTime: 30m
  connMaxIdleTime: 5m
  pingTimeout: 3s
  slowThreshold: 200ms
  logLevel: warn

redis:
  # Full connection string; redis:// or rediss:// (rediss enables TLS).
  # When REDIS_URL is set (here or via the environment) the url/addr/username/
  # password/db/tls values in this file are IGNORED, so the localhost addr
  # below cannot shadow a cloud endpoint. Discrete REDIS_* environment
  # variables may still override individual fields of the URL.
  url: ""
  addr: 127.0.0.1:6379
  username: ""
  password: ""
  db: 0
  # Force TLS when the endpoint is configured via addr instead of rediss://.
  tls: false

inventoryReconcile:
  enabled: true
  interval: 5m
  timeout: 3s
  autoFix: true

rabbitmq:
  url: amqp://order_app:order_dev_password@127.0.0.1:5672/
  connectTimeout: 5s
  reconnectDelay: 5s
  orderTimeout:
    delay: 30m
    outboxPollInterval: 1s
    outboxRetryDelay: 5s
    publishBatchSize: 100
    consumerPrefetch: 10

jwt:
  expireHours: 24

http:
  server:
    readTimeout: 5s
    writeTimeout: 20s
    idleTimeout: 60s
    readHeaderTimeout: 2s
    maxHeaderBytesKib: 128
    timeout: 18s

# Go runtime profiling. OFF by default - /debug/pprof exposes goroutine stacks,
# heap contents and a CPU sampler, so enabling it is opening it.
#
# Addr must be loopback; startup fails otherwise. That is why enabling this on a
# cloud host does not open a remote port - reach a remote instance through a
# tunnel instead:
#   ssh -L 6060:127.0.0.1:6060 <host>
# then point the profiler at http://127.0.0.1:6060.
#
# Override with PPROF_ENABLED / PPROF_ADDR. PPROF_ENABLED must be a real boolean
# (true/false/1/0) - anything else fails startup rather than silently reading as
# off, the same fail-closed rule REDIS_TLS follows.
pprof:
  enabled: false
  addr: 127.0.0.1:6060
